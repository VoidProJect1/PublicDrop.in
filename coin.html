<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Details — PublicDrop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.2.1/dist/chartjs-chart-financial.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
<style>
:root{--ff:'Bricolage Grotesque',sans-serif;--fm:'DM Mono',monospace;
--bg:#F7F8FC;--surface:#FFFFFF;--surface2:#F2F3F8;--surface3:#E8EAF2;--surface4:#DDE0EE;
--border:rgba(0,0,0,.07);--border2:rgba(0,0,0,.12);--border3:rgba(0,0,0,.18);
--t1:#0A0C14;--t2:#4A4F6A;--t3:#8B90AB;--t4:#C2C6DB;
--up:#0EA66A;--upb:rgba(14,166,106,.12);--upbr:rgba(14,166,106,.25);
--dn:#E8334A;--dnb:rgba(232,51,74,.1);--dnbr:rgba(232,51,74,.22);
--accent:#1A56DB;--accentb:rgba(26,86,219,.1);
--sha-sm:0 1px 3px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
--sha:0 2px 12px rgba(0,0,0,.07),0 8px 30px rgba(0,0,0,.05);
--sha-lg:0 12px 40px rgba(0,0,0,.12),0 4px 14px rgba(0,0,0,.06);
--r:14px;--rs:10px;--rx:7px;--pill:999px;--nav-h:62px;}
[data-theme="dark"]{--bg:#0B0C11;--surface:#12141C;--surface2:#181A24;--surface3:#1F2130;--surface4:#272A3B;
--border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.10);--border3:rgba(255,255,255,.16);
--t1:#F0F1F8;--t2:#8C91AD;--t3:#505570;--t4:#2E3148;
--sha-sm:0 1px 3px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.2);
--sha:0 2px 12px rgba(0,0,0,.4),0 8px 30px rgba(0,0,0,.3);
--sha-lg:0 12px 40px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.3);}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:var(--ff);background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .25s,color .25s;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}
nav{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:500;box-shadow:var(--sha-sm);}
.nav-inner{max-width:1500px;margin:0 auto;padding:0 24px;height:var(--nav-h);display:flex;align-items:center;gap:14px;}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.logo-mk{width:36px;height:36px;background:linear-gradient(135deg,#1A56DB 0%,#6366F1 100%);border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(26,86,219,.35);position:relative;overflow:hidden;}
.logo-mk::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.15) 0%,transparent 60%);}
.logo-mk svg{width:20px;height:20px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));}
.logo-name{font-size:18px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,var(--t1) 0%,var(--accent) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.logo-name span{-webkit-text-fill-color:var(--t3);background:none;font-weight:500;font-size:16px;}
.back-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--pill);border:1.5px solid var(--border2);color:var(--t2);font-size:13px;font-weight:700;background:transparent;transition:all .15s;white-space:nowrap;}
.back-btn:hover{border-color:var(--border3);color:var(--t1);background:var(--surface2);}
.nav-r{display:flex;gap:8px;margin-left:auto;align-items:center;}
.btn-s{padding:7px 16px;border-radius:var(--pill);background:var(--t1);color:var(--bg);font-size:13px;font-weight:700;border:none;transition:all .2s cubic-bezier(.34,1.56,.64,1);}
.btn-s:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.22);}
.btn-s:active{transform:scale(.96) translateY(0);}
.btn-o{padding:7px 14px;border-radius:var(--pill);background:transparent;border:1.5px solid var(--border3);color:var(--t1);font-size:13px;font-weight:700;transition:all .15s;}
.btn-o:hover{background:var(--surface2);}
.nav-search-btn{display:flex;align-items:center;gap:8px;
padding:8px 16px;border-radius:var(--pill);
border:none;
background:linear-gradient(135deg,rgba(26,86,219,.12) 0%,rgba(99,102,241,.10) 100%);
color:var(--t2);font-size:13px;font-weight:700;
cursor:pointer;transition:all .22s;white-space:nowrap;
font-family:var(--ff);position:relative;overflow:hidden;
box-shadow:0 0 0 1.5px var(--border2),inset 0 1px 0 rgba(255,255,255,.08);}
.nav-search-btn::before{content:'';position:absolute;inset:0;
background:linear-gradient(135deg,rgba(26,86,219,.0) 0%,rgba(99,102,241,.0) 100%);
transition:background .22s;}
.nav-search-btn:hover{color:var(--accent);
box-shadow:0 0 0 1.5px rgba(26,86,219,.4),0 4px 20px rgba(26,86,219,.15),inset 0 1px 0 rgba(255,255,255,.1);
background:linear-gradient(135deg,rgba(26,86,219,.18) 0%,rgba(99,102,241,.14) 100%);
transform:translateY(-1px);}
.nav-search-btn svg{flex-shrink:0;transition:transform .22s;}
.nav-search-btn:hover svg{transform:scale(1.15);}
.nav-search-kbd{display:inline-flex;align-items:center;
font-size:10px;font-weight:700;padding:2px 6px;
border-radius:5px;
background:rgba(255,255,255,.06);
color:var(--t3);border:1px solid var(--border2);
font-family:var(--fm);letter-spacing:.5px;
margin-left:2px;}
@media(max-width:640px){.nav-search-btn{padding:8px 12px;}
.nav-search-btn .nav-search-label,.nav-search-kbd{display:none;}}
.search-overlay{position:fixed;inset:0;z-index:9000;
display:flex;flex-direction:column;
opacity:0;pointer-events:none;
transition:opacity .22s ease;}
.search-overlay.open{opacity:1;pointer-events:auto;}
.search-overlay-bg{position:absolute;inset:0;
background:rgba(0,0,0,.6);
backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);}
.search-header{position:relative;z-index:1;
margin:0 auto;
width:min(820px,100vw);
padding:0;
transform:translateY(-32px) scale(.97);
opacity:0;
transition:transform .3s cubic-bezier(.34,1.22,.64,1), opacity .22s ease;}
.search-overlay.open .search-header{transform:translateY(0) scale(1);opacity:1;}
.search-inner{display:flex;align-items:center;gap:10px;
padding:10px 12px 10px 18px;
margin:24px 16px 0;
background:var(--surface);
border-radius:20px;
border:1.5px solid transparent;
background-clip:padding-box;
box-shadow:0 0 0 1.5px rgba(26,86,219,.45),0 20px 60px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.07);
position:relative;}
.search-inner::before{content:'';position:absolute;inset:-1.5px;
background:linear-gradient(135deg,rgba(26,86,219,.6),rgba(99,102,241,.4),rgba(26,86,219,.3));
border-radius:21px;z-index:-1;}
.search-icon-wrap{flex-shrink:0;width:38px;height:38px;
border-radius:12px;
background:linear-gradient(135deg,rgba(26,86,219,.2),rgba(99,102,241,.15));
display:flex;align-items:center;justify-content:center;
border:1px solid rgba(26,86,219,.2);}
.search-icon-wrap svg{color:var(--accent);}
.search-input-wrap{flex:1;position:relative;display:flex;align-items:center;}
.search-input{width:100%;height:44px;
padding:0 44px 0 4px;
border:none;outline:none;background:transparent;
font-family:var(--ff);font-size:18px;font-weight:600;
color:var(--t1);caret-color:var(--accent);
letter-spacing:-.3px;}
.search-input::placeholder{color:var(--t4);font-weight:500;}
.search-clear{position:absolute;right:0;
display:flex;align-items:center;justify-content:center;
width:30px;height:30px;border-radius:50%;
background:var(--surface3);border:none;cursor:pointer;
color:var(--t3);transition:all .15s;opacity:0;pointer-events:none;}
.search-clear.visible{opacity:1;pointer-events:auto;}
.search-clear:hover{background:var(--surface4);color:var(--t1);}
.search-divider-v{width:1.5px;height:24px;background:var(--border2);flex-shrink:0;}
.search-close{display:flex;align-items:center;justify-content:center;
width:38px;height:38px;border-radius:12px;
border:1.5px solid var(--border2);background:var(--surface2);
cursor:pointer;color:var(--t2);font-size:16px;font-weight:700;
transition:all .15s;flex-shrink:0;}
.search-close:hover{border-color:var(--dn);color:var(--dn);background:var(--dnb);}
@media(max-width:640px){.search-inner{margin:16px 12px 0;padding:8px 10px 8px 14px;gap:8px;}
.search-input{font-size:16px;height:40px;}
.search-icon-wrap{width:34px;height:34px;border-radius:10px;}}
.search-results-panel{position:relative;z-index:1;
margin:8px 16px 0;
background:var(--surface);
border:1.5px solid rgba(26,86,219,.25);
border-radius:18px;
box-shadow:0 24px 70px rgba(0,0,0,.28),0 0 0 1px rgba(255,255,255,.04);
max-height:calc(100vh - 220px);
overflow-y:auto;
scrollbar-width:thin;scrollbar-color:var(--border3) transparent;
transform:translateY(-8px);opacity:0;
transition:transform .25s cubic-bezier(.34,1.1,.64,1) .06s,opacity .18s ease .06s;}
.search-overlay.open .search-results-panel{transform:translateY(0);opacity:1;}
.search-results-panel::-webkit-scrollbar{width:4px;}
.search-results-panel::-webkit-scrollbar-thumb{background:var(--border3);border-radius:4px;}
@media(max-width:640px){.search-results-panel{margin:6px 12px 0;border-radius:14px;}}
.sr-section{padding:12px 6px 4px;}
.sr-section-title{font-size:10.5px;font-weight:700;letter-spacing:2px;
text-transform:uppercase;color:var(--t3);padding:4px 14px 8px;}
.sr-item{display:flex;align-items:center;gap:13px;
padding:10px 16px;border-radius:var(--rs);
cursor:pointer;transition:background .12s, transform .1s;
text-decoration:none;color:inherit;margin:2px 6px;}
.sr-item:hover,.sr-item.active{background:var(--surface2);transform:translateX(2px);}
.sr-coin-img{width:38px;height:38px;border-radius:50%;
object-fit:cover;background:var(--surface3);
border:2px solid var(--border2);flex-shrink:0;
display:flex;align-items:center;justify-content:center;
overflow:hidden;}
.sr-coin-img img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;}
.sr-coin-img.fallback{font-size:14px;font-weight:800;
background:linear-gradient(135deg,var(--accent),#6366F1);
color:#fff;}
.sr-coin-info{flex:1;min-width:0;}
.sr-coin-name{font-size:14px;font-weight:700;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sr-coin-name mark{background:none;color:var(--accent);font-weight:800;}
.sr-coin-sym{font-size:11.5px;font-weight:600;color:var(--t3);font-family:var(--fm);}
.sr-coin-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0;}
.sr-price{font-size:13px;font-weight:700;font-family:var(--fm);color:var(--t1);}
.sr-chg{font-size:11px;font-weight:700;padding:2px 7px;border-radius:var(--pill);}
.sr-chg.up{background:var(--upb);color:var(--up);}
.sr-chg.dn{background:var(--dnb);color:var(--dn);}
.sr-empty{padding:32px 20px;text-align:center;color:var(--t3);}
.sr-empty-icon{font-size:32px;margin-bottom:8px;}
.sr-empty-msg{font-size:14px;font-weight:600;}
.sr-empty-sub{font-size:12px;color:var(--t4);margin-top:4px;}
.sr-loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:24px;color:var(--t3);font-size:13px;font-weight:600;}
.sr-loading-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:srDot 1.2s ease infinite;}
.sr-loading-dot:nth-child(2){animation-delay:.15s;}
.sr-loading-dot:nth-child(3){animation-delay:.3s;}
@keyframes srDot{0%,80%,100%{transform:scale(.5);opacity:.4;}40%{transform:scale(1);opacity:1;}}
.sr-shortcut-bar{display:flex;align-items:center;gap:6px;
padding:10px 20px 14px;flex-wrap:wrap;
border-top:1px solid var(--border);}
.sr-shortcut-chip{display:flex;align-items:center;gap:5px;
padding:5px 12px;border-radius:var(--pill);
background:var(--surface2);border:1.5px solid var(--border2);
font-size:12px;font-weight:700;color:var(--t2);
cursor:pointer;transition:all .14s;}
.sr-shortcut-chip:hover{background:var(--accentb);border-color:var(--accent);color:var(--accent);}
.sr-shortcut-chip img{width:16px;height:16px;border-radius:50%;}
.sr-footer{display:flex;align-items:center;justify-content:space-between;
padding:10px 20px 14px;border-top:1px solid var(--border);
font-size:11px;color:var(--t4);}
.sr-footer-kbd{display:inline-flex;align-items:center;gap:5px;}
.sr-footer-key{display:inline-flex;align-items:center;justify-content:center;
padding:2px 6px;border-radius:4px;
border:1px solid var(--border3);background:var(--surface3);
font-family:var(--fm);font-size:10px;color:var(--t3);}
.menu-wrap{position:relative;}
.menu-btn{width:36px;height:36px;border-radius:var(--rx);border:1.5px solid var(--border2);background:var(--surface2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;}
.menu-btn:hover,.menu-btn.open{border-color:var(--border3);background:var(--surface3);}
.menu-icon{display:flex;flex-direction:column;gap:4px;width:16px;}
.menu-icon span{display:block;height:2px;background:var(--t2);border-radius:2px;transition:all .2s;}
.menu-btn.open .menu-icon span:nth-child(1){transform:translateY(6px) rotate(45deg);}
.menu-btn.open .menu-icon span:nth-child(2){opacity:0;transform:scaleX(0);}
.menu-btn.open .menu-icon span:nth-child(3){transform:translateY(-6px) rotate(-45deg);}
.menu-dd{position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);border:1.5px solid var(--border2);border-radius:var(--r);box-shadow:var(--sha-lg);min-width:210px;padding:6px;z-index:600;opacity:0;transform:translateY(-8px) scale(.97);pointer-events:none;transition:all .2s cubic-bezier(.34,1.56,.64,1);}
.menu-dd.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
.menu-item{display:flex;align-items:center;gap:9px;width:100%;padding:9px 12px;border-radius:var(--rx);font-size:13.5px;font-weight:600;color:var(--t1);background:transparent;border:none;cursor:pointer;text-decoration:none;transition:background .12s;font-family:var(--ff);text-align:left;}
.menu-item:hover{background:var(--surface2);}
.menu-ic{font-size:15px;width:20px;text-align:center;flex-shrink:0;}
.menu-sep{height:1px;background:var(--border);margin:5px 0;}
.page{max-width:1500px;margin:0 auto;padding:24px 24px 80px;}
.bc{display:flex;align-items:center;gap:6px;margin-bottom:20px;font-size:12.5px;color:var(--t3);flex-wrap:wrap;}
.bc a{color:var(--t3);font-weight:600;transition:color .15s;}
.bc a:hover{color:var(--t1);}
.bc-sep{color:var(--t4);}
.coin-hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:28px 32px;margin-bottom:20px;box-shadow:var(--sha-sm);position:relative;overflow:hidden;}
.coin-hero::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),#6366F1,#0EA66A);background-size:200% auto;animation:shimmer 4s linear infinite;z-index:1;}
.ch-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px;}
.ch-left{display:flex;align-items:center;gap:18px;min-width:0;flex:1;}
.ch-img-wrap{width:82px;height:82px;min-width:82px;flex-shrink:0;
border-radius:50%;
padding:0;
background:transparent;
box-shadow:none;
display:flex;align-items:center;justify-content:center;}
.ch-img-inner{width:82px;height:82px;
border-radius:50%;
overflow:hidden;
background:var(--surface2);
display:flex;align-items:center;justify-content:center;
flex-shrink:0;}
.ch-img{width:100%;height:100%;
border-radius:50%;
object-fit:cover;object-position:center;
display:block;
background:transparent;}
.ch-info{min-width:0;flex:1;}
.ch-badges{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:var(--pill);}
.badge-sym{background:var(--surface3);color:var(--t2);border:1px solid var(--border2);font-family:var(--fm);}
.badge-rank{background:var(--surface2);color:var(--t3);border:1px solid var(--border);}
.badge-live{background:rgba(14,166,106,.12);color:var(--up);border:1px solid rgba(14,166,106,.25);}
.badge-wss{background:rgba(26,86,219,.1);color:var(--accent);border:1px solid rgba(26,86,219,.2);font-family:var(--fm);font-size:10px;}
.badge-exchange{background:var(--surface3);color:var(--t2);border:1px solid var(--border2);}
.ch-name{font-size:26px;font-weight:800;letter-spacing:-.8px;margin-bottom:8px;line-height:1;}
.ch-price-block{margin-bottom:6px;}
.ch-price{font-size:40px;font-weight:800;letter-spacing:-1.5px;line-height:1;display:inline;}
.ch-price-inr{display:block;font-size:15px;font-weight:600;color:var(--t2);font-family:var(--fm);margin-top:4px;letter-spacing:0;}
.ch-price-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px;}
.chg-pill{display:inline-flex;align-items:center;gap:3px;padding:5px 12px;border-radius:var(--pill);font-size:13px;font-weight:700;font-family:var(--fm);}
.chg-up{background:var(--upb);color:var(--up);border:1px solid var(--upbr);}
.chg-dn{background:var(--dnb);color:var(--dn);border:1px solid var(--dnbr);}
.ch-actions{display:flex;gap:8px;align-items:flex-start;flex-shrink:0;flex-wrap:wrap;}
.wl-btn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border2);background:var(--surface2);font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--t4);transition:all .15s;}
.wl-btn:hover{border-color:#F59E0B;color:#F59E0B;}
.wl-btn.on{color:#F59E0B;border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.07);}
.up-c{color:var(--up);}
.dn-c{color:var(--dn);}
.alert-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.alert-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--pill);font-size:12px;font-weight:700;border:1.5px solid var(--border2);background:var(--surface2);color:var(--t2);transition:all .18s;cursor:pointer;}
.alert-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accentb);}
.alert-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accentb);}
.alert-btn .dot{width:7px;height:7px;border-radius:50%;background:var(--t4);display:inline-block;transition:background .15s;}
.alert-btn.active .dot{background:var(--accent);box-shadow:0 0 0 3px rgba(26,86,219,.15);}
.range-bar{margin-bottom:22px;}
.rb-labels{display:flex;justify-content:space-between;font-size:11.5px;font-family:var(--fm);color:var(--t3);margin-bottom:6px;}
.rb-track{height:6px;background:var(--surface3);border-radius:3px;position:relative;overflow:visible;}
.rb-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--dn),#F59E0B,var(--up));}
.rb-thumb{position:absolute;top:50%;width:14px;height:14px;background:var(--surface);border-radius:50%;transform:translateY(-50%);border:2.5px solid var(--t1);box-shadow:var(--sha-sm);}
.quick-stats{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--border);}
.qs{padding:16px 18px;border-right:1px solid var(--border);}
.qs:last-child{border-right:none;}
.qs-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:5px;}
.qs-val{font-family:var(--fm);font-size:14px;font-weight:600;color:var(--t1);}
.qs-sub{font-size:10.5px;color:var(--t4);margin-top:2px;font-family:var(--fm);}
.key-stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:20px;}

.share-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:12px;}
.share-coin{display:flex;align-items:center;gap:12px;min-width:0;}
.share-coin-img-wrap{width:50px;height:50px;flex-shrink:0;border-radius:50%;padding:0;background:transparent;box-shadow:none;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.share-coin-img-inner{width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--surface3);display:flex;align-items:center;justify-content:center;}
.share-coin-img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:var(--surface3);}
.share-coin-name{font-size:17px;font-weight:800;letter-spacing:-.4px;}
.share-coin-sub{font-size:12px;color:var(--t3);margin-top:3px;font-family:var(--fm);}
.share-close{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border2);background:var(--surface2);color:var(--t3);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0;}
.share-close:hover{background:var(--surface3);color:var(--t1);border-color:var(--border3);}
.share-url-row{background:var(--surface2);border:1.5px solid var(--border2);border-radius:var(--rs);padding:11px 14px;margin-bottom:16px;display:flex;align-items:center;gap:10px;}
.share-url-icon{font-size:16px;flex-shrink:0;}
.share-url-text{font-family:var(--fm);font-size:12px;color:var(--t2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.share-copy-btn{flex-shrink:0;padding:7px 15px;border-radius:var(--pill);background:var(--t1);color:var(--bg);font-size:12px;font-weight:800;border:none;cursor:pointer;transition:all .18s;font-family:var(--ff);white-space:nowrap;}
.share-copy-btn:hover{opacity:.85;}
.share-copy-btn.copied{background:var(--up);color:#fff;}
.share-div{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.share-div::before,.share-div::after{content:'';flex:1;height:1px;background:var(--border);}
.share-div span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t4);}
.share-socials{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px;}
.share-soc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:13px 8px;border-radius:var(--rs);border:1.5px solid var(--border);background:var(--surface2);cursor:pointer;transition:all .15s;color:var(--t2);font-size:11.5px;font-weight:700;font-family:var(--ff);}
.share-soc:hover{border-color:var(--border3);background:var(--surface3);color:var(--t1);transform:translateY(-1px);}
.share-soc svg{width:20px;height:20px;}
.share-foot{text-align:center;font-size:11.5px;color:var(--t4);font-family:var(--fm);}
.share-foot strong{color:var(--accent);}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--t1);color:var(--bg);padding:11px 22px;border-radius:var(--pill);font-size:13.5px;font-weight:700;box-shadow:var(--sha-lg);z-index:9999;transition:transform .34s cubic-bezier(.34,1.56,.64,1);pointer-events:none;max-width:92vw;white-space:nowrap;}
#toast.show{transform:translateX(-50%) translateY(0);}
.loading-page{display:flex;align-items:center;justify-content:center;min-height:60vh;flex-direction:column;gap:16px;}
.loading-page .spinner{width:44px;height:44px;border-width:3px;}
.loading-dots{display:flex;gap:6px;}
.loading-dot{width:6px;height:6px;background:var(--t3);border-radius:50%;animation:dotpulse 1.2s ease-in-out infinite;}
.loading-dot:nth-child(2){animation-delay:.2s;}
.loading-dot:nth-child(3){animation-delay:.4s;}
@keyframes dotpulse{0%,80%,100%{transform:scale(0);opacity:.4}40%{transform:scale(1);opacity:1}}
.err-page{display:flex;align-items:center;justify-content:center;min-height:60vh;flex-direction:column;gap:10px;text-align:center;padding:32px;}
.err-icon{font-size:56px;}
.err-title{font-size:18px;font-weight:800;letter-spacing:-.4px;}
.err-msg{color:var(--t2);font-size:13.5px;max-width:360px;line-height:1.7;margin-top:4px;}
.err-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center;}

@keyframes slideInLeft{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}

function fmtP(n){
  if(n==null||isNaN(n)) return '—'; n = parseFloat(n);
  if(n>=1e6)  return '$'+n.toLocaleString('en-US',{maximumFractionDigits:0});
  if(n>=10000) return '$'+n.toLocaleString('en-US',{maximumFractionDigits:0});
  if(n>=1000) return '$'+n.toLocaleString('en-US',{maximumFractionDigits:2});
  if(n>=1)    return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:4});
  if(n>=0.01) return '$'+n.toFixed(5);
  if(n>=0.0001) return '$'+n.toFixed(7);
  return '$'+n.toPrecision(4);
}
function fmtINR(usd){
  const v = usd * RATES.INR;
  if(v >= 1e7) return '₹'+(v/1e7).toFixed(2)+' Cr';
  if(v >= 1e5) return '₹'+(v/1e5).toFixed(2)+' L';
  if(v >= 1000) return '₹'+v.toLocaleString('en-IN',{maximumFractionDigits:2});
  if(v >= 1) return '₹'+v.toFixed(2);
  if(v >= 0.01) return '₹'+v.toFixed(4);
  return '₹'+v.toPrecision(4);
}
function fmtINRLarge(usd){
  const v = usd * RATES.INR;
  if(v >= 1e12) return '₹'+(v/1e12).toFixed(2)+' Lakh Cr';
  if(v >= 1e9)  return '₹'+(v/1e9).toFixed(2)+' Arab';
  if(v >= 1e7)  return '₹'+(v/1e7).toFixed(2)+' Cr';
  if(v >= 1e5)  return '₹'+(v/1e5).toFixed(2)+' L';
  return '₹'+v.toLocaleString('en-IN',{maximumFractionDigits:0});
}
function fmtV(n){
  n=parseFloat(n); if(!n||isNaN(n)) return '—';
  if(n>=1e9) return '$'+(n/1e9).toFixed(2)+'B';
  if(n>=1e6) return '$'+(n/1e6).toFixed(2)+'M';
  if(n>=1e3) return '$'+(n/1e3).toFixed(1)+'K';
  return '$'+n.toFixed(2);
}
function fn(n,d=2){ return (n!=null&&!isNaN(n)) ? parseFloat(n).toLocaleString('en-US',{maximumFractionDigits:d}) : '—'; }

const B_HOSTS = ['api.binance.com','api1.binance.com','api2.binance.com','api3.binance.com'];
let _bHost = 0;
async function bFetch(path, ms=8000){
  for(let i=0; i<B_HOSTS.length; i++){
  const host = B_HOSTS[(_bHost+i) % B_HOSTS.length];
  const ctrl = new AbortController();
  const tid  = setTimeout(()=>ctrl.abort(), ms);
  try{
  const res  = await fetch(`https://${host}${path}`, {signal:ctrl.signal});
  clearTimeout(tid);
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  _bHost = (_bHost+i) % B_HOSTS.length;
  return data;
  }catch(e){
  clearTimeout(tid);
  if(i === B_HOSTS.length-1) throw new Error(`BN_FAIL: ${e.message||''}`);
  }
  }
}

async function bybitFetch(sym, ms=8000){
  const ctrl = new AbortController();
  const tid  = setTimeout(()=>ctrl.abort(), ms);
  try{
  const r = await fetch(`https://api.bybit.com/v5/market/tickers?category=spot&symbol=${sym}USDT`,{signal:ctrl.signal});
  clearTimeout(tid);
  if(!r.ok) throw new Error(`HTTP ${r.status}`);
  const d = await r.json();
  if(d.retCode !== 0 || !d.result?.list?.length) throw new Error('Not listed on Bybit');
  const t = d.result.list[0];
  return {
  lastPrice:t.lastPrice, priceChange:String(parseFloat(t.lastPrice)-parseFloat(t.prevPrice24h)),
  priceChangePercent:t.price24hPcnt ? (parseFloat(t.price24hPcnt)*100).toFixed(4) : '0',
  highPrice:t.highPrice24h, lowPrice:t.lowPrice24h, openPrice:t.prevPrice24h,
  prevClosePrice:t.prevPrice24h, weightedAvgPrice:t.lastPrice,
  bidPrice:t.bid1Price, askPrice:t.ask1Price, volume:t.volume24h, quoteVolume:t.turnover24h,
  count:t.volume24h, _source:'bybit'
  };
  }catch(e){ clearTimeout(tid); throw e; }
}

async function mexcFetch(sym, ms=8000){

async function fetchKlines(interval, limit){

  const bIntMap={'1s':'1m','3D':'3d','3M':'1d','6M':'1d','1Y':'1d'};
  const bInt = bIntMap[interval] || interval;

  const safeLimit = Math.min(limit, 1000);
  try{
  const k = await bFetch(`/api/v3/klines?symbol=${PAIR}&interval=${bInt}&limit=${safeLimit}`);
  if(Array.isArray(k)&&k.length) return k.map(r=>({t:r[0],o:parseFloat(r[1]),h:parseFloat(r[2]),l:parseFloat(r[3]),c:parseFloat(r[4]),v:parseFloat(r[5])}));
  }catch(e){}

  try{
  const intMap={'1m':'1','3m':'3','5m':'5','15m':'15','30m':'30','1h':'60','2h':'120','4h':'240','6h':'360','12h':'720','1d':'D','3d':'D','1w':'W','1M':'M'};
  const bybitInt=intMap[bInt]||'D';
  const r=await fetch(`https://api.bybit.com/v5/market/kline?category=spot&symbol=${SYM}USDT&interval=${bybitInt}&limit=${safeLimit}`);
  const d=await r.json();
  if(d.retCode===0&&d.result?.list?.length){
  return d.result.list.reverse().map(r=>({t:parseInt(r[0]),o:parseFloat(r[1]),h:parseFloat(r[2]),l:parseFloat(r[3]),c:parseFloat(r[4]),v:parseFloat(r[5])}));
  }
  }catch(e){}

  try{
  const r=await fetch(`https://api.mexc.com/api/v3/klines?symbol=${SYM}USDT&interval=${bInt}&limit=${safeLimit}`);
  const k=await r.json();
  if(Array.isArray(k)&&k.length) return k.map(r=>({t:r[0],o:parseFloat(r[1]),h:parseFloat(r[2]),l:parseFloat(r[3]),c:parseFloat(r[4]),v:parseFloat(r[5])}));
  }catch(e){}
  throw new Error('Chart data unavailable');
}

async function requestNotifPermission(){
  if(!('Notification' in window)) return false;
  if(Notification.permission === 'granted') return true;
  if(Notification.permission === 'denied') return false;
  const p = await Notification.requestPermission();
  return p === 'granted';
}
function sendPriceAlert(exchange, price, prevPrice){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const dir  = price > prevPrice ? '▲' : '▼';
  const diff = Math.abs(((price - prevPrice)/prevPrice)*100).toFixed(3);
  const body = `${dir} ${fmtP(price)}  (${diff}% change)\n${exchange} · ${SYM}/USDT`;
  const icon = window._pdLogoCache?.[SYM.toUpperCase()] || `https://publicdrop.in/APIv3/logo?sym=${SYM}`;
  try{ new Notification(`🔔 ${NAME} Price Update`, {body, icon, tag:`pd-alert-${exchange}-${SYM}`, silent:false}); }catch(e){}
}
async function toggleAlert(btnEl){
  if(ALERT.enabled){
  ALERT.enabled = false; btnEl.classList.remove('active'); btnEl.title=`Enable price alerts`; toast(`🔕 Price alerts off`); return;
  }
  const ok = await requestNotifPermission();
  if(!ok){ toast('⚠️ Please allow notifications in your browser settings'); return; }
  ALERT.enabled = true; ALERT.lastPrice = cvPrice; btnEl.classList.add('active'); btnEl.title=`Disable price alerts`; toast(`🔔 Price alerts ON for ${SYM}`);
}
function handlePriceUpdate(exchange, newPrice){
  if(!ALERT.enabled) return;
  if(ALERT.lastPrice===0){ ALERT.lastPrice=newPrice; return; }
  if(newPrice===ALERT.lastPrice) return;
  sendPriceAlert(exchange, newPrice, ALERT.lastPrice);
  ALERT.lastPrice=newPrice;
}

function calcSMA(data, period){
  const result=[];
  for(let i=0;i<data.length;i++){
  if(i<period-1){result.push(null);continue;}
  const sum=data.slice(i-period+1,i+1).reduce((a,b)=>a+b,0);
  result.push(sum/period);
  }
  return result;
}
function calcEMA(data, period){
  const k=2/(period+1);
  const result=[];
  let ema=null;
  for(let i=0;i<data.length;i++){
  if(ema===null){
  if(i===period-1) ema=data.slice(0,period).reduce((a,b)=>a+b,0)/period;
  result.push(null); continue;
  }
  ema=data[i]*k+ema*(1-k);
  result.push(ema);
  }
  return result;
}
function calcRSI(data, period=14){
  const result=new Array(period).fill(null);
  let gains=0, losses=0;
  for(let i=1;i<=period;i++){
  const diff=data[i]-data[i-1];
  if(diff>0) gains+=diff; else losses+=Math.abs(diff);
  }
  let avgGain=gains/period, avgLoss=losses/period;
  result.push(avgLoss===0?100:100-(100/(1+avgGain/avgLoss)));
  for(let i=period+1;i<data.length;i++){
  const diff=data[i]-data[i-1];
  const g=diff>0?diff:0, l=diff<0?Math.abs(diff):0;
  avgGain=(avgGain*(period-1)+g)/period;
  avgLoss=(avgLoss*(period-1)+l)/period;
  result.push(avgLoss===0?100:100-(100/(1+avgGain/avgLoss)));
  }
  return result;
}
function calcMACD(data){
  const ema12=calcEMA(data,12), ema26=calcEMA(data,26);
  const macdLine=data.map((_,i)=>(ema12[i]!=null&&ema26[i]!=null)?ema12[i]-ema26[i]:null);
  const signalLine=calcEMA(macdLine.filter(v=>v!=null),9);
  const signalFull=new Array(macdLine.filter(v=>v==null).length).fill(null).concat(signalLine);
  const histogram=macdLine.map((v,i)=>(v!=null&&signalFull[i]!=null)?v-signalFull[i]:null);
  return {macd:macdLine, signal:signalFull, histogram};
}
function calcBollingerBands(data, period=20, stdMult=2){
  const sma=calcSMA(data,period);
  const upper=[], lower=[];
  for(let i=0;i<data.length;i++){
  if(sma[i]===null){upper.push(null);lower.push(null);continue;}
  const slice=data.slice(i-period+1,i+1);
  const std=Math.sqrt(slice.map(v=>Math.pow(v-sma[i],2)).reduce((a,b)=>a+b,0)/period);
  upper.push(sma[i]+stdMult*std);
  lower.push(sma[i]-stdMult*std);
  }
  return {middle:sma,upper,lower};
}

function _fmtLargeUSD_tmp(n){
  if(!n||isNaN(n)) return '—';
  n=parseFloat(n);
  if(n>=1e12) return '$'+(n/1e12).toFixed(2)+'T';
  if(n>=1e9)  return '$'+(n/1e9).toFixed(2)+'B';
  if(n>=1e6)  return '$'+(n/1e6).toFixed(2)+'M';
  if(n>=1e3)  return '$'+(n/1e3).toFixed(1)+'K';
  return '$'+n.toFixed(2);
}

function toggleIndicator(ind){
  const btn = document.getElementById(`IND_${ind.toUpperCase()}`);
  const panel = document.getElementById(`IND_PANEL_${ind.toUpperCase()}`);

  const overlayInds = ['bb','ema','sma','ma','sar','super'];
  const subInds = ['rsi','macd','vol','kdj','obv','wr','stochrsi'];
  const classMap={rsi:'rsi-active',macd:'macd-active',bb:'bb-active',ema:'ema-active',sma:'ema-active',ma:'ema-active',vol:'active',kdj:'rsi-active',obv:'ema-active',wr:'rsi-active',stochrsi:'rsi-active',sar:'bb-active',super:'macd-active'};

  if(_activeIndicators.has(ind)){
  _activeIndicators.delete(ind);
  if(btn) btn.classList.remove('active',classMap[ind]);
  if(panel) panel.classList.remove('show');
  if(overlayInds.includes(ind)) loadChart(curInterval,null);
  } else {
  _activeIndicators.add(ind);
  if(btn) btn.classList.add(classMap[ind]||'active');
  if(subInds.includes(ind)){
  if(panel) panel.classList.add('show');
  if(_klinesCache.length) renderIndicator(ind, _klinesCache);
  }
  if(overlayInds.includes(ind)) loadChart(curInterval,null);
  }
  _updateIndCount();
}

function renderIndicator(ind, klines){
  const closes = klines.map(k=>k.c);
  const dark = document.documentElement.getAttribute('data-theme')==='dark';

  if(ind==='rsi'){
  const rsi = calcRSI(closes,14);
  const lastRSI = rsi.filter(v=>v!=null).pop();
  const canvas=document.getElementById('RSI_CHART'); if(!canvas) return;
  if(_indCharts.rsi){ _indCharts.rsi.destroy(); _indCharts.rsi=null; }
  _indCharts.rsi = new Chart(canvas,{
  type:'line',
  data:{labels:klines.map((_,i)=>i), datasets:[
  {data:rsi,borderColor:'#A855F7',backgroundColor:'transparent',borderWidth:1.5,pointRadius:0,tension:.3},
  {data:new Array(klines.length).fill(70),borderColor:'rgba(232,51,74,.4)',backgroundColor:'transparent',borderWidth:1,pointRadius:0,borderDash:[4,4]},
  {data:new Array(klines.length).fill(30),borderColor:'rgba(14,166,106,.4)',backgroundColor:'transparent',borderWidth:1,pointRadius:0,borderDash:[4,4]}
  ]},

function toggleDepthView(btn){

function _renderDepthChart(){
  const bids = BN_WSS.book.bids || [];
  const asks = BN_WSS.book.asks || [];
  if(!bids.length && !asks.length) { setTimeout(_renderDepthChart, 1000); return; }

  const sortedBids = [...bids].sort((a,b)=>parseFloat(b[0])-parseFloat(a[0]));
  const sortedAsks = [...asks].sort((a,b)=>parseFloat(a[0])-parseFloat(b[0]));

  let cumBidQty=0, cumAskQty=0;
  const bidPoints=sortedBids.map(r=>{cumBidQty+=parseFloat(r[1]);return{x:parseFloat(r[0]),y:cumBidQty};});
  const askPoints=sortedAsks.map(r=>{cumAskQty+=parseFloat(r[1]);return{x:parseFloat(r[0]),y:cumAskQty};});

  const canvas = document.getElementById('DEPTH_CHART');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const dark = document.documentElement.getAttribute('data-theme')==='dark';

  if(_depthChart){ _depthChart.destroy(); _depthChart=null; }

  const h = canvas.offsetHeight || 200;
  const bidGrad = ctx.createLinearGradient(0, 0, 0, h);
  bidGrad.addColorStop(0, dark ? 'rgba(0,200,100,.45)' : 'rgba(0,180,85,.38)');
  bidGrad.addColorStop(0.6, dark ? 'rgba(0,200,100,.18)' : 'rgba(0,160,75,.14)');
  bidGrad.addColorStop(1, 'rgba(0,168,90,0)');

  const askGrad = ctx.createLinearGradient(0, 0, 0, h);
  askGrad.addColorStop(0, dark ? 'rgba(220,40,60,.42)' : 'rgba(200,30,46,.35)');
  askGrad.addColorStop(0.6, dark ? 'rgba(220,40,60,.16)' : 'rgba(200,30,46,.12)');
  askGrad.addColorStop(1, 'rgba(212,43,58,0)');

  _depthChart = new Chart(canvas, {
  type:'line',
  data:{
  datasets:[
  {
  data:bidPoints,
  borderColor: dark ? '#00C864' : '#00A855',
  backgroundColor: bidGrad,
  fill:true, borderWidth:2.5, pointRadius:0, tension:0, stepped:'after',
  borderCapStyle:'round'
  },
  {
  data:askPoints,
  borderColor: dark ? '#FF3D57' : '#D42B3A',
  backgroundColor: askGrad,
  fill:true, borderWidth:2.5, pointRadius:0, tension:0, stepped:'before',
  borderCapStyle:'round'
  }
  ]
  },
  options:{
  responsive:true, maintainAspectRatio:false,
  animation:{duration:400, easing:'easeOutQuart'},
  plugins:{
  legend:{display:false},
  tooltip:{
  backgroundColor: dark ? 'rgba(15,17,26,.97)' : 'rgba(10,12,20,.96)',
  titleColor: 'rgba(255,255,255,.5)',
  bodyColor:'#fff',
  bodyFont:{family:'DM Mono',size:11,weight:'600'},
  titleFont:{family:'DM Mono',size:10},
  borderColor: dark ? 'rgba(255,255,255,.1)' : 'rgba(255,255,255,.08)',
  borderWidth:1, padding:12, cornerRadius:10,
  displayColors:true,
  callbacks:{
  label:c=>{
  const side = c.datasetIndex===0 ? '🟢 Bids' : '🔴 Asks';
  return `  ${side}  Cum: ${c.parsed.y?.toFixed(2)}  @ $${c.parsed.x}`;
  }
  }
  }
  },
  scales:{
  x:{
  type:'linear',
  grid:{color: dark?'rgba(255,255,255,.04)':'rgba(0,0,0,.04)', drawTicks:false},
  border:{display:false},
  ticks:{color: dark?'rgba(120,130,160,.8)':'rgba(100,110,140,.8)', font:{size:9,family:'DM Mono'}, maxTicksLimit:7, padding:6, callback:v=>_fmtYTick(v)}
  },
  y:{
  grid:{color: dark?'rgba(255,255,255,.04)':'rgba(0,0,0,.04)', drawBorder:false},
  border:{display:false},
  position:'right',
  ticks:{color: dark?'rgba(120,130,160,.8)':'rgba(100,110,140,.8)', font:{size:9,family:'DM Mono'}, maxTicksLimit:4, padding:8, callback:v=>v>=1000?(v/1000).toFixed(1)+'K':v.toFixed(2)}
  }
  }
  }
  });
}

const _candlePan = { allKlines:[], windowStart:0, windowSize:25, isDragging:false, dragStartX:0, dragStartWindow:0 };

function _buildCandleChart(canvas, klines, interval, dark){
  const upColor   = '#00A85A'; // darker green
  const downColor = '#D42B3A'; // darker red
  const upAlpha   = dark ? 'rgba(0,168,90,.92)'  : 'rgba(0,140,74,.95)';
  const dnAlpha   = dark ? 'rgba(212,43,58,.92)' : 'rgba(200,30,46,.95)';

  _candlePan.allKlines = klines;
  _candlePan.windowSize = 25;
  _candlePan.windowStart = Math.max(0, klines.length - 25);

  _renderCandleWindow(canvas, interval, dark, upColor, downColor, upAlpha, dnAlpha);
  _setupCandleDrag(canvas, interval, dark, upColor, downColor, upAlpha, dnAlpha);
}

function _getWindowedKlines(){
  const {allKlines, windowStart, windowSize} = _candlePan;
  return allKlines.slice(windowStart, windowStart + windowSize);
}

  overlayDatasets.push({type:'line',data:sma25.map((v,i)=>({x:labels[i],y:v})),borderColor:'#EC4899',backgroundColor:'transparent',borderWidth:1.5,pointRadius:0,tension:.3});

  overlayDatasets.push({type:'line',data:bbM.map((v,i)=>({x:labels[i],y:v})),borderColor:'rgba(99,102,241,.4)',backgroundColor:'transparent',borderWidth:1,borderDash:[4,4],pointRadius:0,tension:.3});
  overlayDatasets.push({type:'line',data:bbL.map((v,i)=>({x:labels[i],y:v})),borderColor:'rgba(99,102,241,.6)',backgroundColor:'rgba(99,102,241,.04)',borderWidth:1,pointRadius:0,tension:.3});
  }

  const timeUnit = _candleTimeUnit(interval);

  const total = _candlePan.allKlines.length;
  const posText = `${_candlePan.windowStart+1}–${Math.min(_candlePan.windowStart+25,total)} / ${total}`;

  chartInst = new Chart(canvas, {
  type: 'candlestick',
  data: {

  {

  color: { up:upAlpha, down:dnAlpha, unchanged: dark?'rgba(140,145,173,.7)':'rgba(74,79,106,.7)' },
  borderColor: { up:upColor, down:downColor, unchanged: dark?'#8C91AD':'#4A4F6A' },
  borderWidth: 1.5
  },
  ...overlayDatasets
  ]
  },
  options: {
  responsive: true, maintainAspectRatio: false,
  interaction: { mode:'nearest', intersect:false },
  plugins: {
  legend: { display: false },

  },
  scales: {

  time:{ unit:timeUnit, displayFormats:{minute:'HH:mm',hour:'HH:mm',day:'MMM d',week:'MMM d',month:'MMM yy'} },
  grid:{display:false}, border:{display:false},
  ticks:{ color:dark?'rgba(80,85,112,.9)':'rgba(139,144,171,.9)', font:{size:10,family:'DM Mono',weight:'500'}, maxTicksLimit:6, maxRotation:0, minRotation:0, autoSkip:true, padding:6 }

function _setupCandleDrag(canvas, interval, dark, upColor, downColor, upAlpha, dnAlpha){

  if(canvas._pdDragMC){ canvas.removeEventListener('mousedown', canvas._pdDragMC); }
  if(canvas._pdDragMM){ window.removeEventListener('mousemove', canvas._pdDragMM); }
  if(canvas._pdDragMU){ window.removeEventListener('mouseup', canvas._pdDragMU); }
  if(canvas._pdDragTC){ canvas.removeEventListener('touchstart', canvas._pdDragTC); }
  if(canvas._pdDragTM){ canvas.removeEventListener('touchmove', canvas._pdDragTM); }
  if(canvas._pdDragTU){ canvas.removeEventListener('touchend', canvas._pdDragTU); }

  const canvasWidth = () => canvas.offsetWidth || 400;
  const pixelsPerCandle = () => canvasWidth() / _candlePan.windowSize;

  let startX=0, startWindow=0, lastX=0, velocity=0, lastTime=0, rafId=null;

  function panBy(deltaX){

  const ppc = pixelsPerCandle();
  const candleDelta = -Math.round(deltaX / ppc);
  const newStart = Math.max(0, Math.min(_candlePan.allKlines.length - _candlePan.windowSize, startWindow + candleDelta));
  if(newStart !== _candlePan.windowStart){
  _candlePan.windowStart = newStart;
  _renderCandleWindow(canvas, interval, dark, upColor, downColor, upAlpha, dnAlpha);
  }
  }

  function onMouseDown(e){
  if(e.button!==0) return;
  _candlePan.isDragging=true;
  startX=e.clientX; startWindow=_candlePan.windowStart;
  canvas.style.cursor='grabbing';
  e.preventDefault();
  }
  function onMouseMove(e){
  if(!_candlePan.isDragging) return;
  panBy(e.clientX-startX);
  }
  function onMouseUp(){ _candlePan.isDragging=false; canvas.style.cursor='crosshair'; }

  function onTouchStart(e){
  if(e.touches.length!==1) return;
  startX=e.touches[0].clientX; startWindow=_candlePan.windowStart;
  lastX=startX; lastTime=Date.now(); velocity=0;
  }
  function onTouchMove(e){
  if(e.touches.length!==1) return;
  const now=Date.now(), dx=e.touches[0].clientX-lastX;
  velocity=dx/(now-lastTime||1)*16;
  lastX=e.touches[0].clientX; lastTime=now;
  panBy(e.touches[0].clientX-startX);
  e.preventDefault();
  }
  function onTouchEnd(){

  let v=velocity;
  function momentum(){
  if(Math.abs(v)<0.5) return;
  startX-=v; startWindow=_candlePan.windowStart;
  panBy(v);
  v*=0.88;
  rafId=requestAnimationFrame(momentum);
  }
  if(rafId) cancelAnimationFrame(rafId);
  momentum();
  }

  canvas.addEventListener('mousedown',onMouseDown);
  window.addEventListener('mousemove',onMouseMove);
  window.addEventListener('mouseup',onMouseUp);
  canvas.addEventListener('touchstart',onTouchStart,{passive:false});
  canvas.addEventListener('touchmove',onTouchMove,{passive:false});
  canvas.addEventListener('touchend',onTouchEnd);
  canvas.style.cursor='crosshair';

  canvas._pdDragMC=onMouseDown; canvas._pdDragMM=onMouseMove; canvas._pdDragMU=onMouseUp;
  canvas._pdDragTC=onTouchStart; canvas._pdDragTM=onTouchMove; canvas._pdDragTU=onTouchEnd;
}

let _lpTimer = null;
let _lpActive = false;

function _setupLongPress(canvas, klines){

  if(canvas._pdLPTC){ canvas.removeEventListener('touchstart', canvas._pdLPTC, true); }
  if(canvas._pdLPTM){ canvas.removeEventListener('touchmove',  canvas._pdLPTM, true); }
  if(canvas._pdLPTU){ canvas.removeEventListener('touchend',   canvas._pdLPTU, true); }
  if(canvas._pdLPMD){ canvas.removeEventListener('mousedown',  canvas._pdLPMD); }
  if(canvas._pdLPMM){ window.removeEventListener('mousemove',  canvas._pdLPMM); }
  if(canvas._pdLPMU){ window.removeEventListener('mouseup',    canvas._pdLPMU); }

  const LONG_MS = 350; // ms hold to trigger

  function showCandleAt(clientX, clientY){
  if(!chartInst) return;
  const rect = canvas.getBoundingClientRect();
  const x = clientX - rect.left;
  const y = clientY - rect.top;

  const xScale = chartInst.scales.x;
  const yScale = chartInst.scales.y;
  if(!xScale || !yScale) return;

  const chartArea = chartInst.chartArea;

  const cx = Math.max(chartArea.left, Math.min(chartArea.right, x));

  const ds = chartInst.data.datasets[0];
  if(!ds || !ds.data.length) return;

  const ts = xScale.getValueForPixel(cx);

  let nearestIdx = 0, minDist = Infinity;
  ds.data.forEach((d, i)=>{
  const dist = Math.abs(d.x - ts);
  if(dist < minDist){ minDist = dist; nearestIdx = i; }
  });
  const candle = ds.data[nearestIdx];
  const kline = klines[nearestIdx];
  if(!candle) return;

  const px = xScale.getPixelForValue(candle.x);

  const py = Math.max(chartArea.top, Math.min(chartArea.bottom, yScale.getPixelForValue(candle.c)));

  const overlay = document.getElementById('LP_OVERLAY');
  const popup   = document.getElementById('LP_POPUP');
  const vline   = document.getElementById('LP_VLINE');
  const hline   = document.getElementById('LP_HLINE');
  const ylabel  = document.getElementById('LP_YLABEL');
  if(!overlay || !popup) return;

  overlay.style.display = 'block';
  popup.style.display   = 'block';
  _lpActive = true;

  vline.style.left = px + 'px';
  hline.style.top  = py + 'px';
  ylabel.style.top = py + 'px';
  ylabel.textContent = _fmtYTick(candle.c);

  const pct = ((candle.c - candle.o) / candle.o * 100);
  const isUp = candle.c >= candle.o;
  const t = new Date(candle.x);
  document.getElementById('LP_POPUP_TIME').textContent =
  t.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) + ' ' +
  t.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false});
  document.getElementById('LP_O').textContent = fmtP(candle.o);
  document.getElementById('LP_C').style.color = isUp ? 'var(--up)' : 'var(--dn)';
  document.getElementById('LP_C').textContent = fmtP(candle.c);
  document.getElementById('LP_H').textContent = fmtP(candle.h);
  document.getElementById('LP_L').textContent = fmtP(candle.l);
  document.getElementById('LP_V').textContent = kline ? fn(kline.v, 2) + ' ' + SYM : '—';
  const pctEl = document.getElementById('LP_PCT');
  pctEl.style.color = isUp ? 'var(--up)' : 'var(--dn)';
  pctEl.textContent = (isUp ? '+' : '') + pct.toFixed(2) + '%';

  const popW = popup.offsetWidth || 180;
  const wrapW = canvas.offsetWidth;
  popup.style.left = (px > wrapW/2) ? Math.max(0, px - popW - 10) + 'px' : (px + 10) + 'px';
  popup.style.top = '10px';
  }

  function hideLongPress(){
  clearTimeout(_lpTimer);
  _lpActive = false;
  const overlay = document.getElementById('LP_OVERLAY');
  const popup   = document.getElementById('LP_POPUP');
  if(overlay) overlay.style.display = 'none';
  if(popup)   popup.style.display   = 'none';
  }

  let _touchX=0, _touchY=0, _touchMoved=false;
  function onTouchStart(e){
  if(e.touches.length !== 1) return;
  _touchX = e.touches[0].clientX;
  _touchY = e.touches[0].clientY;
  _touchMoved = false;
  clearTimeout(_lpTimer);
  _lpTimer = setTimeout(()=>{
  if(!_touchMoved){
  showCandleAt(_touchX, _touchY);
  }
  }, LONG_MS);
  }
  function onTouchMove(e){
  if(!e.touches.length) return;
  const dx = Math.abs(e.touches[0].clientX - _touchX);
  const dy = Math.abs(e.touches[0].clientY - _touchY);
  if(dx > 6 || dy > 6) _touchMoved = true;
  if(_lpActive){

  showCandleAt(e.touches[0].clientX, e.touches[0].clientY);
  e.preventDefault(); // prevent scroll while viewing detail
  }
  }
  function onTouchEnd(){
  clearTimeout(_lpTimer);
  if(_lpActive) hideLongPress();
  }

  let _mouseHeld = false;
  function onMouseDown(e){
  _mouseHeld = true;
  clearTimeout(_lpTimer);
  _lpTimer = setTimeout(()=>{
  if(_mouseHeld) showCandleAt(e.clientX, e.clientY);
  }, LONG_MS);
  }
  function onMouseMove(e){
  if(_lpActive) showCandleAt(e.clientX, e.clientY);
  }
  function onMouseUp(){
  _mouseHeld = false;
  clearTimeout(_lpTimer);
  if(_lpActive) hideLongPress();
  }

  canvas.addEventListener('touchstart', onTouchStart, {passive:true, capture:true});
  canvas.addEventListener('touchmove',  onTouchMove,  {passive:false, capture:true});
  canvas.addEventListener('touchend',   onTouchEnd,   {passive:true,  capture:true});
  canvas.addEventListener('mousedown',  onMouseDown);
  window.addEventListener('mousemove',  onMouseMove);
  window.addEventListener('mouseup',    onMouseUp);

  canvas._pdLPTC = onTouchStart;
  canvas._pdLPTM = onTouchMove;
  canvas._pdLPTU = onTouchEnd;
  canvas._pdLPMD = onMouseDown;
  canvas._pdLPMM = onMouseMove;
  canvas._pdLPMU = onMouseUp;
}

function _candleTimeUnit(interval){
  if(['1s','1m','3m','5m','15m','30m'].includes(interval)) return 'minute';
  if(['1h','2h','4h','6h','8h','12h'].includes(interval)) return 'hour';
  if(['1d','3D','1w'].includes(interval)) return 'day';
  if(interval==='1M') return 'month'; // 1 Month candle = month unit
  if(interval==='3M'||interval==='6M'||interval==='1Y') return 'day';
  return 'month';
}

function _fmtLabel(ts, interval){
  const d=new Date(ts);
  if(interval==='1m'||interval==='5m'||interval==='15m'||interval==='1h') return d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false});
  if(interval==='4h') return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  if(interval==='1M') return d.toLocaleDateString('en-US',{month:'short',year:'numeric'}); // 1 Month: "Jan 2024"
  if(interval==='1d'||interval==='1w'||interval==='3M'||interval==='6M'||interval==='1Y') return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  return d.toLocaleDateString('en-US',{month:'short',year:'2-digit'});
}

function _fmtYTick(v){
  if(v==null||isNaN(v)) return '';
  if(v>=1e6) return '$'+(v/1e6).toFixed(1)+'M';
  if(v>=1e3) return '$'+v.toLocaleString('en-US',{maximumFractionDigits:0});
  if(v>=1)   return '$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:3});
  if(v>=0.01) return '$'+v.toFixed(4);
  return '$'+v.toPrecision(3);
}

  const hiName   = highlight ? _highlight(name, highlight) : name;

  return `

  onerror="this.onerror=null;this.style.display='none';this.parentElement.classList.add('fallback');this.parentElement.textContent='${sym.charAt(0)}';"

function _highlight(str, query){
  if(!query) return str;
  const idx = str.toLowerCase().indexOf(query.toLowerCase());
  if(idx === -1) return str;
  return str.slice(0,idx) + `<mark>${str.slice(idx,idx+query.length)}</mark>` + str.slice(idx+query.length);
}

function _onSearchInput(){
  const q = SEARCH.input.value.trim();
  SEARCH.query = q;
  SEARCH.clearBtn.classList.toggle('visible', q.length > 0);
  SEARCH.activeIdx = -1;
  clearTimeout(SEARCH.debounceTimer);
  if(!q){ _renderSearchDefault(); return; }

  _renderLoading();
  SEARCH.debounceTimer = setTimeout(async ()=>{
    // Try PublicDrop search API first
    try{
      const r = await fetch(`https://publicdrop.in/APIv3/search?q=${encodeURIComponent(q)}`);
      if(r.ok){
        const data = await r.json();
        const results = Array.isArray(data) ? data : (data.results||data.coins||[]);
        if(results.length){
          const tickers = results.slice(0,12).map(c=>({
            symbol: (c.symbol||c.sym||'').toUpperCase()+'USDT',
            name: c.name||c.symbol||'',
            lastPrice: String(c.price_usd||0),
            priceChangePercent: String(c.change_24h||0),
            logo_url: c.logo_url||c.logo_small||'',
            quoteVolume: String(c.volume_24h||0)
          }));
          if(SEARCH.query === q) _renderResults(tickers, q);
          return;
        }
      }
    }catch(e){}
    // Fallback to local search
    if(!SEARCH.allTickers) await _prefetchTickers();
    if(SEARCH.query === q) _doLocalSearch(q);
  }, 200);
}

function _renderLoading(){
  SEARCH.panel.innerHTML = `
  <div class="sr-loading">
  <div class="sr-loading-dot"></div>
  <div class="sr-loading-dot"></div>
  <div class="sr-loading-dot"></div>
  <span>Searching…</span>
  </div>`;
}

function _doLocalSearch(q){
  if(!SEARCH.allTickers) return;
  const ql = q.toLowerCase();
  const matched = SEARCH.allTickers.filter(t=>{
  const sym = t.symbol.replace('USDT','');
  const name = (NAME_MAP[sym]||sym).toLowerCase();
  return sym.toLowerCase().startsWith(ql) || name.includes(ql);
  }).slice(0, 12);

  if(!matched.length){
  SEARCH.panel.innerHTML = `
  <div class="sr-empty">
  <div class="sr-empty-icon">🔍</div>
  <div class="sr-empty-msg">No results for "${q}"</div>
  <div class="sr-empty-sub">Try a different symbol or full name</div>
  </div>`;
  return;
  }
  _renderResults(matched, q);
}

function _renderResults(tickers, q){
  const panel = SEARCH.panel;
  const items = tickers.map(t=>{
  const sym  = t.symbol.replace('USDT','');
  const name = t.name || NAME_MAP[sym] || sym;
  return _srItemHTML(sym, name, t.lastPrice, t.priceChangePercent, true, q, t.logo_url||'');
  }).join('');
  panel.innerHTML = `
  <div class="sr-section">
  <div class="sr-section-title">Results · ${tickers.length} found</div>
  ${items}
  </div>
  <div class="sr-footer">
  <span class="sr-footer-kbd">
  <span class="sr-footer-key">↑↓</span> navigate &nbsp;
  <span class="sr-footer-key">↵</span> open &nbsp;
  <span class="sr-footer-key">Esc</span> close
  </span>
  <span>Powered by PublicDROP</span>
  </div>`;
  panel.querySelectorAll('.sr-item').forEach(el=>{
  el.addEventListener('click',()=>navigateToCoin(el.dataset.pair));
  });
}

async function _doCGSearch(q){

  if(SEARCH.query !== q) return;
  if(!SEARCH.allTickers) await _prefetchTickers();
  if(SEARCH.query !== q) return;
  _doLocalSearch(q);
}

function _searchKeyNav(e){
  if(!SEARCH.open) return;
  const items = SEARCH.panel.querySelectorAll('.sr-item');
  if(!items.length) return;
  if(e.key==='ArrowDown'){
  e.preventDefault();
  SEARCH.activeIdx = Math.min(SEARCH.activeIdx+1, items.length-1);
  } else if(e.key==='ArrowUp'){
  e.preventDefault();
  SEARCH.activeIdx = Math.max(SEARCH.activeIdx-1, 0);
  } else if(e.key==='Enter'){
  if(SEARCH.activeIdx >= 0 && items[SEARCH.activeIdx]){
  navigateToCoin(items[SEARCH.activeIdx].dataset.pair);
  } else if(SEARCH.query){
  const first = items[0];
  if(first) navigateToCoin(first.dataset.pair);
  }
  return;
  } else { return; }
  items.forEach((el,i)=>el.classList.toggle('active', i===SEARCH.activeIdx));
  if(items[SEARCH.activeIdx]) items[SEARCH.activeIdx].scrollIntoView({block:'nearest'});
}

function navigateToCoin(pair){
  closeSearch();
  location.replace(`/coin/${pair.toLowerCase()}`);
}

  renderGas(data){
  const body = document.getElementById('GAS_BODY');
  if(!body) return;
  if(!data){ body.innerHTML=`<div class="gas-error">⚠️ Could not fetch gas data.<br>Check internet connection.</div>`; return; }

  const netLabel = {eth:'Ethereum Mainnet', bsc:'BNB Smart Chain', polygon:'Polygon PoS'}[data.network]||'';
  const nativeSym = {eth:'ETH', bsc:'BNB', polygon:'MATIC'}[data.network]||'ETH';

  const gasLimits = {transfer:21000, erc20:65000, swap:150000, nft:200000};
  const txType = GAS.activeTxType || 'transfer';
  const gasLimit = gasLimits[txType] || 21000;

  function tierHtml(tier, info, icon, cls){
  const gweiStr = typeof info.gwei === 'number' ? (info.gwei < 10 ? info.gwei.toFixed(2) : info.gwei.toFixed(1)) : '—';

  const nativePrice = {eth: GAS.ethPrice, bsc: GAS.bnbPrice, polygon: GAS.maticPrice}[data.network];
  const usdVal = nativePrice ? (info.gwei * gasLimit * 1e-9 * nativePrice) : info.usd;
  const usdStr = usdVal ? '$'+(usdVal < 0.01 ? usdVal.toFixed(4) : usdVal < 1 ? usdVal.toFixed(3) : usdVal.toFixed(2)) : '';
  return `<div class="gas-tier ${cls}">
  <div class="gas-tier-icon">${icon}</div>
  <div class="gas-tier-label">${tier}</div>
  <div class="gas-tier-gwei">${gweiStr}<span class="gas-tier-gwei-unit"> Gwei</span></div>
  <div class="gas-tier-usd">${usdStr ? usdStr : '—'}</div>
  <div class="gas-tier-time">${info.time}</div>
  </div>`;
  }

  const now = new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  body.innerHTML = `
  <div class="gas-grid">
  ${tierHtml('Slow', data.slow, '🐢', 'slow')}
  ${tierHtml('Std',  data.std,  '⚡', 'std')}
  ${tierHtml('Fast', data.fast, '🚀', 'fast')}
  </div>
  <div class="gas-meta">
  <div class="gas-base">Base: <strong>${data.base ? (typeof data.base==='number'?data.base.toFixed(2):data.base) : '—'} Gwei</strong> · ${nativeSym}</div>
  <div class="gas-updated"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--up);animation:pulse 1.4s ease infinite"></span>${now}</div>
  </div>`;
  },

  async refresh(){
  const net = this.activeNet;
  try{
  if(!this.ethPrice) await this.fetchEthPrice();
  const data = await this.fetchGas(net);
  this.cache[net] = data;
  if(this.activeNet === net) this.renderGas(data);
  }catch(e){
  if(this.activeNet === net) this.renderGas(null);
  }
  },

  start(){
  this.fetchEthPrice();
  this.refresh();
  clearInterval(this.timer);
  this.timer = setInterval(()=>this.refresh(), 15000); // refresh every 15s
  },

  switch(net){
  this.activeNet = net;
  if(this.cache[net]){
  this.renderGas(this.cache[net]);
  } else {
  const body = document.getElementById('GAS_BODY');
  if(body) body.innerHTML=`<div class="gas-loading"><div class="spinner" style="width:18px;height:18px;border-width:2px"></div>Fetching gas prices…</div>`;
  this.refresh();
  }
  }
};

function switchGasNet(net, btn){
  document.querySelectorAll('.gas-net-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  GAS.switch(net);
}

function switchGasTxType(type, btn){
  document.querySelectorAll('.gas-tx-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  GAS.activeTxType = type;
  const labels = {
  transfer:'Transfer · ~21,000 gas units',
  erc20:'ERC-20 Token · ~65,000 gas units',
  swap:'DEX Swap · ~150,000 gas units',
  nft:'NFT Mint/Transfer · ~200,000 gas units'
  };
  const info = document.getElementById('GAS_TX_INFO');
  if(info) info.textContent = labels[type] || '';

  if(GAS.cache[GAS.activeNet]) GAS.renderGas(GAS.cache[GAS.activeNet]);
}

loadCoin();
GAS.start();
</script>

<script>

function _addRipple(btn, e){
  if(!btn) return;
  const rip = document.createElement('span');
  rip.className = 'ripple';
  const sz = Math.max(btn.offsetWidth, btn.offsetHeight);
  rip.style.cssText = `width:${sz}px;height:${sz}px;left:${(btn.offsetWidth-sz)/2}px;top:${(btn.offsetHeight-sz)/2}px;`;
  btn.appendChild(rip);
  rip.addEventListener('animationend',()=>rip.remove());
}

const IV_ALL = [
  {label:'Time', int:'1s'},
  {label:'1s',   int:'1s'},
  {label:'1m',   int:'1m'},
  {label:'3m',   int:'3m'},
  {label:'5m',   int:'5m'},
  {label:'15m',  int:'15m'},
  {label:'30m',  int:'30m'},
  {label:'1h',   int:'1h'},
  {label:'2h',   int:'2h'},
  {label:'4h',   int:'4h'},
  {label:'6h',   int:'6h'},
  {label:'8h',   int:'8h'},
  {label:'12h',  int:'12h'},
  {label:'1D',   int:'1d'},
  {label:'3D',   int:'3D'},
  {label:'1W',   int:'1w'},
  {label:'1M',   int:'1M'},
];

function openIntervalModal(){

  _addRipple(document.getElementById('CT_MORE_BTN'));
  const bd    = document.getElementById('IV_MODAL_BD');
  const modal = document.getElementById('IV_MODAL');
  const grid  = document.getElementById('IV_MODAL_GRID');

  grid.innerHTML = IV_ALL.map(iv=>`
  <button class="iv-modal-btn${curInterval===iv.int?' active':''}" data-interval="${iv.int}" onclick="pickInterval('${iv.int}',this)">
  ${iv.label}
  </button>`).join('');

  bd.style.display = 'block';
  modal.style.display = 'block';
  requestAnimationFrame(()=>{
  bd.style.opacity = '1';
  modal.style.transform = 'translateY(0)';
  });
  document.body.style.overflow = 'hidden';
}

function closeIntervalModal(){
  const bd    = document.getElementById('IV_MODAL_BD');
  const modal = document.getElementById('IV_MODAL');
  bd.style.opacity = '0';
  modal.style.transform = 'translateY(100%)';
  setTimeout(()=>{
  bd.style.display = 'none';
  modal.style.display = 'none';
  document.body.style.overflow = '';
  }, 320);
}

function pickInterval(interval, btn){

  document.querySelectorAll('.iv-modal-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');

  const mainIntervals = ['15m','1h','1d','1w','1M'];
  const moreBtn = document.getElementById('CT_MORE_BTN');
  if(!mainIntervals.includes(interval) && moreBtn){

  const found = IV_ALL.find(iv=>iv.int===interval);
  moreBtn.innerHTML = (found?found.label:interval)+' <svg width="10" height="10" viewBox="0 0 10 10" fill="none" style="vertical-align:middle;margin-left:2px"><path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  moreBtn.classList.add('active');
  } else if(moreBtn){
  moreBtn.innerHTML = 'More <svg width="10" height="10" viewBox="0 0 10 10" fill="none" style="vertical-align:middle;margin-left:2px"><path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  moreBtn.classList.remove('active');
  }
  closeIntervalModal();

  setTimeout(()=>loadChart(interval, null), 80);
}
</script>
