server {
    listen 80;
    listen [::]:80;
    server_name publicdrop.in www.publicdrop.in;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name publicdrop.in www.publicdrop.in;

    # ── SSL (update paths to your actual cert files) ──────────────────
    ssl_certificate     /etc/letsencrypt/live/publicdrop.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/publicdrop.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Root ──────────────────────────────────────────────────────────
    root  /var/www/publicdrop;
    index index.html;

    # ── Gzip compression (speeds up all file delivery) ────────────────
    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1024;
    gzip_vary on;

    # ── Serve JS files WITHOUT .js extension ──────────────────────────
    # Browser requests /app → server secretly reads app.js
    location = /app {
        default_type application/javascript;
        alias /var/www/publicdrop/app.js;
        add_header Cache-Control "public, max-age=3600";
    }

    # Browser requests /firebase-auth → server secretly reads firebase-auth.js
    location = /firebase-auth {
        default_type application/javascript;
        alias /var/www/publicdrop/firebase-auth.js;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── Block direct .js access (nobody can see app.js directly) ──────
    location ~* \.(js)$ {
        deny all;
        return 404;
    }

    # ── CSS served normally (styles.css is not sensitive) ─────────────
    location ~* \.css$ {
        add_header Cache-Control "public, max-age=86400";
    }

    # ── HTML — no cache (always fresh) ────────────────────────────────
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── Default fallback ──────────────────────────────────────────────
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # ── Security headers ──────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
